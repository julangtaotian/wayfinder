# frontend-ai-workflow:start version={{WORKFLOW_VERSION}}
schema: spec-driven

context: |
  项目：{{PROJECT_NAME}}
  预设：{{PRESET}}
  技术栈：{{DEPENDENCY_SUMMARY}}
  依赖事实：根 package.json 直接依赖共 {{DEPENDENCY_PACKAGE_COUNT}} 项；摘要展示 {{DEPENDENCY_SUMMARY_DISPLAYED}} 项，遗漏 {{DEPENDENCY_SUMMARY_OMITTED}} 项
  依赖边界：声明不证明已安装、已使用、安全或兼容；结论必须结合配置、入口、导入和调用关系
  终端与平台：{{TARGET_FORM_FACTOR}} / {{TARGET_PLATFORM_KIND}}（{{TARGET_PLATFORM_FRAMEWORKS}}）
  平台命令：{{PLATFORM_COMMAND_SUMMARY}}（发现不代表已执行）
  页面：{{VIEWS_PATH}}
  组件：{{COMPONENTS_PATH}}
  请求：{{REQUEST_PATH}}
  路由：{{ROUTER_PATH}}
  状态：{{STORE_PATH}}
  构建：{{BUILD_COMMAND}}
  交付构建：{{RELEASE_BUILD_COMMAND}}
  测试：{{TEST_COMMAND}}（{{TEST_STATUS}}）
  Lint：{{LINT_COMMAND}}（{{LINT_STATUS}}）
  项目地图：{{ANALYSIS_STATUS}}（{{ANALYSIS_COVERED_FILES}}/{{SCOPE_INCLUDED_FILES}}）
  实现必须遵守根目录 AGENTS.md 和 wayfinder/frontend.md。

rules:
  proposal:
    - 写清目标、非目标、可观察成功结果、影响范围和待确认问题
    - 接口、权限、公共契约、路由、构建、部署和数据变更必须显式列为风险
  specs:
    - 每项规范至少包含一个可验证场景，覆盖本次适用的主流程和边界状态
    - 接口行为写清字段、错误、空值和兼容语义，不从依赖名或目录名猜测
  design:
    - 复用现有组件、状态、请求与目录约定，并记录调用方、回滚方式和跨平台风险
    - 用户可见行为与正式规格冲突时先修订规格，不用实现细节覆盖产品事实
  tasks:
    - 拆成可独立验证的步骤并标明主要文件；行为变化包含测试或无法自动化的原因
    - 最后一批任务包含最窄验证、必要构建和交付验证；不混入无关重构
# frontend-ai-workflow:end

# 项目可在受管区块之后追加 OpenSpec 规则，升级工具不会覆盖。
