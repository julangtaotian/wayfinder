name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_install_smoke:
        description: Run real Codex install, skill loading, and offline Chromium smoke on all five platforms
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Shared Validation (linux-x64)
    runs-on: ubuntu-24.04
    env:
      LIFECYCLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      LIFECYCLE_REQUIRE_BASE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm run verify:shared
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime

  native-platform:
    name: Native Platform (${{ matrix.platform }})
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      UI_REVIEW_EXPECT_PLATFORM: ${{ matrix.platform }}
      UI_REVIEW_RUNTIME_ROOT: ${{ github.workspace }}/dist/frontend-ai-workflow-${{ matrix.platform }}/plugins/frontend-ai-workflow/runtime/playwright
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Warm locked frontend test cache
        run: npm run prepare:test-runtime
      - name: Remove online frontend test runtime
        run: npm run cleanup:test-runtime
      - name: Prepare native marketplace outside source runtime
        run: node plugins/frontend-ai-workflow/scripts/prepare-platform-marketplace.mjs --write --platform ${{ matrix.platform }}
      - name: Verify native contracts and offline runtimes
        run: npm run verify:platform
      - name: Upload native package report
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-report-${{ matrix.platform }}
          retention-days: 14
          path: dist/frontend-ai-workflow-${{ matrix.platform }}/package-report.json
          if-no-files-found: error
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime
      - name: Clean frontend test cache
        if: always()
        run: npm run cleanup:test-cache

  release-install:
    name: Release Install Smoke (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' && inputs.release_install_smoke
    needs: [shared, native-platform]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Prepare final native marketplace
        run: node plugins/frontend-ai-workflow/scripts/prepare-platform-marketplace.mjs --write --platform ${{ matrix.platform }}
      - name: Install pinned Codex CLI
        run: npm install --prefix .frontend-ai-workflow/cache/release-install-codex --no-audit --no-fund --no-package-lock --ignore-scripts @openai/codex@0.150.0-alpha.8
      - name: Verify install, enablement, skill loading, and offline runtime
        run: node plugins/frontend-ai-workflow/scripts/verify-platform-marketplace-install.mjs --write --revision ${{ github.sha }} --platform ${{ matrix.platform }} --marketplace dist/frontend-ai-workflow-${{ matrix.platform }} --output .frontend-ai-workflow/runs/release-install-smoke/${{ github.sha }}/${{ matrix.platform }}.json --codex-entry .frontend-ai-workflow/cache/release-install-codex/node_modules/@openai/codex/bin/codex.js
      - name: Upload release install report
        uses: actions/upload-artifact@v7
        with:
          name: release-install-smoke-${{ github.sha }}-${{ matrix.platform }}
          retention-days: 14
          path: .frontend-ai-workflow/runs/release-install-smoke/${{ github.sha }}/${{ matrix.platform }}.json
          if-no-files-found: error
