name: Validate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Shared Validation (linux-x64)
    runs-on: ubuntu-24.04
    env:
      LIFECYCLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      LIFECYCLE_REQUIRE_BASE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm run verify:shared
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime

  native-platform:
    name: Native Platform (${{ matrix.platform }})
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      UI_REVIEW_EXPECT_PLATFORM: ${{ matrix.platform }}
      UI_REVIEW_RUNTIME_ROOT: ${{ github.workspace }}/dist/frontend-ai-workflow-${{ matrix.platform }}/plugins/frontend-ai-workflow/runtime/playwright
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Warm locked frontend test cache
        run: npm run prepare:test-runtime
      - name: Remove online frontend test runtime
        run: npm run cleanup:test-runtime
      - name: Prepare native marketplace outside source runtime
        run: node plugins/frontend-ai-workflow/scripts/prepare-platform-marketplace.mjs --write --platform ${{ matrix.platform }}
      - name: Verify native contracts and offline runtimes
        run: npm run verify:platform
      - name: Upload native package report
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-report-${{ matrix.platform }}
          retention-days: 14
          path: dist/frontend-ai-workflow-${{ matrix.platform }}/package-report.json
          if-no-files-found: error
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime
      - name: Clean frontend test cache
        if: always()
        run: npm run cleanup:test-cache
