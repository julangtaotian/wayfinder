name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      UI_REVIEW_EXPECT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm run prepare:test-runtime
      - run: npm run verify
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime
      - name: Build and verify platform plugin package
        run: node plugins/frontend-ai-workflow/scripts/package-plugin-platform.mjs --write --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package-report-${{ matrix.platform }}
          path: dist/frontend-ai-workflow-${{ matrix.platform }}/package-report.json
          if-no-files-found: error
