name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      collect_platform_install_evidence:
        description: Collect real Codex install, load, and offline Chromium evidence on all five platforms
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shared:
    name: Shared validation (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - run: npm run verify:shared
      - name: Clean frontend test runtime
        if: always()
        run: npm run cleanup:test-runtime

  platform:
    name: Validate (${{ matrix.platform }})
    needs: shared
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: macos-15-intel
            platform: darwin-x64
          - os: ubuntu-24.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: win32-x64
    runs-on: ${{ matrix.os }}
    env:
      UI_REVIEW_EXPECT_PLATFORM: ${{ matrix.platform }}
      UI_REVIEW_RUNTIME_ROOT: ${{ github.workspace }}/dist/frontend-ai-workflow-${{ matrix.platform }}/plugins/frontend-ai-workflow/runtime/playwright
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
      - uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
      - name: Prepare platform marketplace outside source runtime
        run: node plugins/frontend-ai-workflow/scripts/prepare-platform-marketplace.mjs --write --platform ${{ matrix.platform }}
      - run: npm run verify:platform
      - name: Install pinned Codex CLI for platform evidence
        if: github.event_name == 'workflow_dispatch' && inputs.collect_platform_install_evidence
        run: npm install --prefix outputs/platform-install-codex --no-audit --no-fund --no-package-lock --ignore-scripts @openai/codex@0.150.0-alpha.8
      - name: Verify real Codex install, load, and offline runtime
        if: github.event_name == 'workflow_dispatch' && inputs.collect_platform_install_evidence
        run: node plugins/frontend-ai-workflow/scripts/verify-platform-marketplace-install.mjs --write --platform ${{ matrix.platform }} --marketplace dist/frontend-ai-workflow-${{ matrix.platform }} --output outputs/platform-install-evidence/${{ matrix.platform }}.json --codex-entry outputs/platform-install-codex/node_modules/@openai/codex/bin/codex.js
      - name: Upload platform package report
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-report-${{ matrix.platform }}
          path: |
            dist/frontend-ai-workflow-${{ matrix.platform }}/package-report.json
            outputs/platform-install-evidence/${{ matrix.platform }}.json
          if-no-files-found: error
